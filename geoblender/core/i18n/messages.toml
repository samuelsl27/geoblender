# Catálogo de idioma de Geoblender: msgid en inglés (es también la versión inglesa) y su
# traducción al español. Forma: ["msgid"] con es = "texto"; los marcadores {nombre} son los
# de str.format y tienen que ser los mismos en los dos (spec 002, T28; iconos-e-idioma.md §2).
# Las etiquetas de los comandos de la barra las añade el catálogo de comandos (spec 003).

# Pestaña «Proyecto» (spec 002) --------------------------------------------------------

["Project"]
es = "Proyecto"

["No project is open"]
es = "No hay ningún proyecto abierto"

["Name: {name}"]
es = "Nombre: {name}"

["Mode: {mode}"]
es = "Modo: {mode}"

["Mode: read-only: {reason}"]
es = "Modo: solo lectura: {reason}"

["writing (local disk)"]
es = "escritura (disco local)"

["writing on the network (cache on this computer)"]
es = "escritura en red (caché en este equipo)"

["writing in a local working copy"]
es = "escritura en una copia local de trabajo"

["Horizontal CRS: EPSG:{code} · {name}"]
es = "CRS horizontal: EPSG:{code} · {name}"

["Vertical CRS: EPSG:{code} · {name}"]
es = "CRS vertical: EPSG:{code} · {name}"

["Vertical CRS: local reference · {note}"]
es = "CRS vertical: referencia local · {note}"

["GeoOrigin: {xyz} m"]
es = "GeoOrigin: {xyz} m"

["Work window: X {xmin} – {xmax}, Y {ymin} – {ymax} m"]
es = "Ventana de trabajo: X {xmin} – {xmax}, Y {ymin} – {ymax} m"

["Work window: not available (only the header could be read)"]
es = "Ventana de trabajo: no disponible (solo se ha leído la cabecera)"

["Grid step: {step} m"]
es = "Paso de rejilla: {step} m"

["Journal: classic"]
es = "Diario: clásico"

["Journal: WAL (it is converted back to classic when writing)"]
es = "Diario: WAL (se devuelve al clásico al escribir)"

["Journal: unknown"]
es = "Diario: desconocido"

["The view is out of date: reload its data"]
es = "La vista está desfasada: vuelva a cargar sus datos"

["Dismiss"]
es = "Descartar"

