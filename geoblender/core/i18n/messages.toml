# Vistas y georreferencia de las escenas ---------------------------------------------------

["EPSG:{crs} + {vertical}, GeoOrigin {xyz}"]
es = "EPSG:{crs} + {vertical}, GeoOrigin {xyz}"

["unsaved"]
es = "sin guardar"

["«{name}», {georef}"]
es = "«{name}», {georef}"

["The view «{view}» belongs to project {projects}, which is not open: Geoblender does not use its georeference and marks it out of date; open the project to work with it."]
es = "La vista «{view}» es del proyecto {projects}, que no está abierto: Geoblender no usa la georreferencia de la vista y la deja desfasada; abra el proyecto para trabajar con ella."

["The view «{view}» belongs to another project ({projects}), not to the open one («{name}», {georef}): «{name}» has been closed and the view is out of date; open its project to work with it."]
es = "La vista «{view}» es de otro proyecto ({projects}), no del abierto («{name}», {georef}): se ha cerrado «{name}» y la vista queda desfasada; abra su proyecto para trabajar con ella."

["The project «{name}» is read-only ({status}): the view «{view}» is in its folder and Ctrl+S would save it inside the project; to keep changes, use File ▸ Save As… outside the project folder."]
es = "El proyecto «{name}» está en solo lectura ({status}): la vista «{view}» es de su carpeta y Ctrl+S la guardaría dentro del proyecto; para conservar cambios, use Archivo ▸ Guardar como… fuera de la carpeta del proyecto."

["The view «{view}» has another georeference than project «{name}»: in the view, {view_georef}; in the project, {project_georef}. The project's is used and the view is out of date: reload its data."]
es = "La vista «{view}» tiene otra georreferencia que el proyecto «{name}»: en la vista, {view_georef}; en el proyecto, {project_georef}. Se usa la del proyecto y la vista queda desfasada: vuelva a cargar sus datos."

[" and {count} more"]
es = " y {count} más"

["The view «{view}» uses files with an absolute path that cannot be saved as relative (another volume or a linked library): {paths}; copy them next to the project if the view must work on another computer."]
es = "La vista «{view}» usa ficheros con ruta absoluta que no se puede guardar relativa (otro volumen o biblioteca enlazada): {paths}; cópielos junto al proyecto si la vista tiene que servir en otro equipo."
