# Validación de los sondeos (spec 005, T08; RF-005-16): los mensajes de las incidencias de las
# bocas y las desviaciones (drillholes/validate.py, MESSAGES). El informe enseña aparte el
# sondeo, la tabla, el tramo, el campo y el valor.

["Hole name «{hole}» is repeated as «{repeated}» (names are compared ignoring case and outer spaces): rename or remove one of them."]
es = "El nombre de sondeo «{hole}» está repetido como «{repeated}» (los nombres se comparan sin distinguir mayúsculas ni espacios exteriores): cambie el nombre de uno de los dos o quítelo."

["Collar {axis} is missing or is not a finite number: enter the coordinate in the collar table."]
es = "Falta la {axis} de la boca o no es un número finito: escriba la coordenada en la tabla de bocas."

["The total depth is missing and cannot be deduced (the hole has no stations or intervals below the collar): enter it in the collar table."]
es = "Falta la profundidad total y no se puede deducir (el sondeo no tiene estaciones ni tramos por debajo de la boca): escríbala en la tabla de bocas."

["The total depth, {depth} m, is not a finite number greater than 0: correct it in the collar table."]
es = "La profundidad total, {depth} m, no es un número finito mayor que 0: corríjala en la tabla de bocas."

["Hole «{hole}» of this record has no collar: add its collar or correct the hole name."]
es = "El sondeo «{hole}» de este registro no tiene boca: añada su boca o corrija el nombre del sondeo."

["This sample has no hole: give it its hole and its interval."]
es = "Esta muestra no tiene sondeo: dele su sondeo y su tramo."

["The hole has no survey stations and no collar orientation, and it is not declared vertical: import its surveys, give its collar orientation or declare it vertical when importing."]
es = "El sondeo no tiene estaciones de desviación ni orientación en la boca, y no está declarado vertical: importe sus desviaciones, dé la orientación en la boca o declárelo vertical al importar."

["Two survey stations at the same depth, {depth} m: remove the repeated one or correct its depth."]
es = "Dos estaciones de desviación a la misma profundidad, {depth} m: quite la repetida o corrija su profundidad."

["The survey station is above the collar (negative depth) or has no depth: correct its depth."]
es = "La estación de desviación está por encima de la boca (profundidad negativa) o no tiene profundidad: corrija su profundidad."

["The survey station at {depth} m is below the bottom of the hole ({bottom} m, with a tolerance of {tolerance} m): correct its depth or the total depth."]
es = "La estación de desviación a {depth} m está por debajo del fondo del sondeo ({bottom} m, con una tolerancia de {tolerance} m): corrija su profundidad o la profundidad total."

["The azimuth is not between 0° and 360°: correct it (degrees from north, clockwise)."]
es = "El azimut no está entre 0° y 360°: corríjalo (grados desde el norte, en el sentido de las agujas del reloj)."

["The inclination is not between −90° and 90°: correct it (degrees from the horizontal, negative downwards)."]
es = "La inclinación no está entre −90° y 90°: corríjala (grados desde la horizontal, negativa hacia abajo)."

["The first survey station is at {depth} m, below the collar: its orientation is extended up to the collar. If there is a measurement at the collar, add it."]
es = "La primera estación de desviación está a {depth} m, por debajo de la boca: se prolonga su orientación hasta la boca. Si hay una medida en la boca, añádala."

["The last survey station is at {depth} m, above the bottom ({bottom} m): its orientation is extended down to the bottom. If there are deeper measurements, add them."]
es = "La última estación de desviación está a {depth} m, por encima del fondo ({bottom} m): se prolonga su orientación hasta el fondo. Si hay medidas más abajo, añádalas."

["The direction changes {rate}°/30 m between the stations at {depth_from} and {depth_to} m (more than {limit}°/30 m): check their azimuth and inclination."]
es = "La dirección cambia {rate}°/30 m entre las estaciones de {depth_from} y {depth_to} m (más de {limit}°/30 m): revise su azimut y su inclinación."

["The collar is outside the project work window: check its coordinates and the declared CRS, or enlarge the work window."]
es = "La boca está fuera de la ventana de trabajo del proyecto: revise sus coordenadas y el CRS declarado, o amplíe la ventana de trabajo."

["All survey stations of the hole have a positive inclination: check the declared inclination convention (here it is negative downwards)."]
es = "Todas las estaciones de desviación del sondeo tienen la inclinación positiva: revise el convenio de inclinación declarado (aquí es negativa hacia abajo)."

["The collar in the layer is not at its X, Y, Z (it was moved outside Geoblender): the stored X, Y, Z prevails; recompute the base to put it back."]
es = "La boca de la capa no está en su X, Y, Z (se movió fuera de Geoblender): manda la X, Y, Z guardada; recalcule la base para volver a ponerla en su sitio."

["The source did not give the total depth: {depth} m has been deduced from the deepest station or interval (CALCULADO). If you know it, enter it in the collar table."]
es = "La fuente no traía la profundidad total: se han deducido {depth} m de la estación o el tramo más profundos (CALCULADO). Si la conoce, escríbala en la tabla de bocas."

# Validación de los sondeos (spec 005, T09; RF-005-16): los mensajes de las incidencias de los
# tramos, los valores y los catálogos (drillholes/validate.py, MESSAGES).

["The interval starts above the collar (negative depth) or has no from depth: correct its from depth."]
es = "El tramo empieza por encima de la boca (profundidad negativa) o no tiene desde: corrija su desde."

["The interval has no to depth: enter it."]
es = "El tramo no tiene hasta: escríbalo."

["The interval ends at {depth_to} m, not below its start at {depth_from} m: correct its from or to depth."]
es = "El tramo acaba a {depth_to} m, que no está por debajo de su desde, a {depth_from} m: corrija su desde o su hasta."

["The interval ends at {depth_to} m, below the bottom of the hole ({bottom} m, with a tolerance of {tolerance} m): correct its to depth or the total depth."]
es = "El tramo acaba a {depth_to} m, por debajo del fondo del sondeo ({bottom} m, con una tolerancia de {tolerance} m): corrija su hasta o la profundidad total."

["The interval overlaps another one of the logging scheme «{log_set}» from {depth_from} to {depth_to} m: correct their from and to depths."]
es = "El tramo se solapa con otro del esquema de logueo «{log_set}» de {depth_from} a {depth_to} m: corrija sus desde y hasta."

["The {element} value overlaps another primary value of the same element from {depth_from} to {depth_to} m: correct their from and to depths, or mark one of them as not primary."]
es = "El valor de {element} se solapa con otro valor primario del mismo elemento de {depth_from} a {depth_to} m: corrija sus desde y hasta, o marque uno de los dos como no primario."

["The lithology code «{code}» is not in the catalog of the logging scheme «{log_set}»: add it to the catalog or correct the code."]
es = "El código de litología «{code}» no está en el catálogo del esquema de logueo «{log_set}»: dele de alta en el catálogo o corrija el código."

["The element «{code}» is not in the element catalog: add it to the catalog or correct the code."]
es = "El elemento «{code}» no está en el catálogo de elementos: dele de alta en el catálogo o corrija el código."

["The sector «{code}» is not in the sector catalog: add it to the catalog or correct the code."]
es = "El sector «{code}» no está en el catálogo de sectores: dele de alta en el catálogo o corrija el código."

["The group «{code}» is not in the group catalog: add it to the catalog or correct the code."]
es = "El grupo «{code}» no está en el catálogo de grupos: dele de alta en el catálogo o corrija el código."

["The zone «{code}» is not in the zone catalog: add it to the catalog or correct the code."]
es = "La zona «{code}» no está en el catálogo de zonas: dele de alta en el catálogo o corrija el código."

["There is more than one primary {element} value for the interval from {depth_from} to {depth_to} m: keep one as primary and mark the others as duplicates, or remove them."]
es = "Hay más de un valor primario de {element} para el tramo de {depth_from} a {depth_to} m: deje uno como primario y marque los demás como duplicados, o quítelos."

["There is a gap with no interval from {depth_from} to {depth_to} m (more than {tolerance} m): add the missing interval or correct the depths."]
es = "Hay un hueco sin tramos de {depth_from} a {depth_to} m (más de {tolerance} m): añada el tramo que falta o corrija las profundidades."

["The value is in {unit} and the catalog unit of {element} is {catalog_unit}; it could not be converted: check the unit."]
es = "El valor está en {unit} y la unidad de {element} en el catálogo es {catalog_unit}; no se ha podido convertir: revise la unidad."

["The value, {value}, is zero or negative and has no detection limit mark: if it is below the detection limit, write it as «<limit» (or declare when importing that a negative value means «<x»); if it is missing, leave it empty."]
es = "El valor, {value}, es cero o negativo y no tiene la marca de límite de detección: si está por debajo del límite, escríbalo como «<límite» (o declare al importar que un valor negativo significa «<x»); si falta, déjelo vacío."

["The interval from {depth_from} to {depth_to} m is shorter than the minimum length ({limit} m): check its depths or join it to the next one."]
es = "El tramo de {depth_from} a {depth_to} m es más corto que la longitud mínima ({limit} m): revise sus profundidades o únalo al siguiente."

["The lithology «{code}» has no density: enter it in the lithology catalog, with its kind, before using it to calculate tonnes."]
es = "La litología «{code}» no tiene densidad: escríbala en el catálogo de litologías, con su tipo, antes de usarla para calcular toneladas."

["The sample code «{sample}» is also used in hole «{hole}» from {depth_from} to {depth_to} m: give each sample its own code."]
es = "El código de muestra «{sample}» se usa también en el sondeo «{hole}» de {depth_from} a {depth_to} m: dé a cada muestra su propio código."

["The hole is planned but has assays: if it has been drilled, mark it as not planned; if not, check which hole the assays belong to."]
es = "El sondeo está planificado pero tiene análisis: si ya se ha perforado, quítele la marca de planificado; si no, revise de qué sondeo son los análisis."

# Validación de los sondeos (spec 005, T10; RF-005-18): la diferencia de la cota de las bocas
# con el MDT (DH-W05) y las notas del informe cuando no se evalúa (drillholes/validate.py,
# MESSAGES).

["The collar elevation, {z} m, minus the DTM elevation at its position, {dem} m, is {dz} m (more than {tolerance} m either way): check the collar Z and its vertical datum, or the DTM."]
es = "La cota de la boca, {z} m, menos la del MDT en su posición, {dem} m, da {dz} m (más de {tolerance} m por encima o por debajo): revise la Z de la boca y su datum vertical, o el MDT."

["No DTM was chosen: the collar elevations have not been compared with the terrain (DH-W05 not evaluated). Choose a DTM when validating to compare them."]
es = "No se eligió ningún MDT: las cotas de las bocas no se han comparado con el terreno (DH-W05 sin evaluar). Elija un MDT al validar para compararlas."

["The collar is outside the DTM or next to cells without data: its elevation has not been compared with the terrain (DH-W05 not evaluated)."]
es = "La boca está fuera del MDT o junto a celdas sin dato: su cota no se ha comparado con el terreno (DH-W05 sin evaluar)."
