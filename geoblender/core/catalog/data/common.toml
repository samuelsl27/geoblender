description.es = "Calcula una entidad de diseño que aún no tiene resultado, traída de otra versión o heredada: con los parámetros que ya tiene en la versión, y se detecta de nuevo lo que se apoya en ella"
entry = "015"
action = "D"
frequency = 1

[[command]]
