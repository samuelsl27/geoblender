[[command]]
key = "ed.undo"
label.en = "Undo"
label.es = "Deshacer"
description.en = "Undo the last change in Blender; it does not undo calculations already written to the project (Project ▸ Control ▸ Provenance and log ▸ Undo calculation)"
description.es = "Deshace el último cambio en Blender; no deshace los cálculos ya escritos en el proyecto (Proyecto ▸ Control ▸ Procedencia y registro ▸ Deshacer cálculo)"
entry = "Blender"
action = "A"
frequency = 3
icon_fallback = "LOOP_BACK"

[[command]]
key = "ed.redo"
label.en = "Redo"
label.es = "Rehacer"
description.en = "Redo what was undone in Blender"
description.es = "Rehace lo deshecho en Blender"
entry = "Blender"
action = "A"
frequency = 2
icon_fallback = "LOOP_FORWARDS"

[[command]]
key = "geoblender.ui_call_pie"
kind = "internal"
label.en = "Pie menu"
label.es = "Menú circular"
