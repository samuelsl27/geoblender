kind = "internal"
label.en = "Bring the entities of…"
label.es = "Traer las entidades de…"
description.en = "Bring the entities of another version to the active one, without their results: they are left as «not calculated»"
description.es = "Trae las entidades de otra versión a la activa, sin sus resultados: quedan «sin calcular»"
entry = "015"
action = "D"
frequency = 1

# La vista previa de una entidad (spec 015, T29; RF-015-26): interna, en el menú «Entidad ▾» (T31). El botón «Vista previa» del
# diálogo de «Plataforma…» es la misma orden de la plataforma con la propiedad oculta ``preview``.
[[command]]
key = "geoblender.des_entity_preview"
kind = "internal"
label.en = "Preview of the entity"
label.es = "Vista previa de la entidad"
description.en = "Show, before calculating, the footprint of a platform, its axis with its sense, the levels at its ends, what rests on it and the constraints it will declare; the marks of a detection of stockpiles; the crown zone of a buttress; the origin, the destination and the corridor of a road, or its axis with its gradients"
description.es = "Enseña, antes de calcular, la huella de una plataforma, su eje con su sentido, las cotas en sus extremos, lo que se le apoya y las restricciones que declarará; las marcas de una detección de acopios; la zona de coronación de un contrafuerte; el origen, el destino y el pasillo de una pista, o su eje con sus pendientes"
entry = "015"
action = "T"
frequency = 2

# El menú «Entidad ▾» (spec 015, T31; RF-015-28, RF-015-05; D-14): lo que se apoya en la entidad y insertar antes o después de otra.
[[command]]
