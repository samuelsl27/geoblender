# Catálogo de comandos de Geoblender (spec 003). Lo que no tiene casa en un menú de la barra:
# «Geoblender ▾» (la barra en modo Blender y el nivel E; BS §3 y §4), los comandos nativos
# del acceso rápido y los auxiliares internos de la interfaz (kind = internal; BS §7.1).
# Las claves son las de los comandos del catálogo (bl_idname o clase, con ?prop=valor si fijan
# propiedades): cada sitio referencia el comando, nunca lo copia (RF-003-06, BS §7.1).

