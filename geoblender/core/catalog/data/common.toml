action = "A"
frequency = 1

# Orden interna de los trabajos en segundo plano (spec 006, T57; RF-004-07): lleva al registro
# de Blender lo que se dice desde un temporizador (la operación de un trabajo que no se hizo).

[[command]]
key = "geoblender.jobs_report"
kind = "internal"
label.en = "Report of a job"
label.es = "Informe de un trabajo"
description.en = "Show a message of a background job in Blender's reports"
description.es = "Muestra un mensaje de un trabajo en segundo plano en el registro de Blender"
entry = "004"
action = "A"
frequency = 0

# Órdenes internas de la procedencia (spec 008, plan §5.3.2): las abren sus paneles
# (parámetros, entradas, lo obsoleto) y sus avisos, no un menú de la barra.

[[command]]
key = "geoblender.core_set_parameter"
kind = "internal"
label.en = "Change parameter…"
label.es = "Cambiar parámetro…"
description.en = "Change the value, type, source or decider of a project parameter, with a reason; from a divergence notice, filled in with the calculated figure"
description.es = "Cambia el valor, el tipo, el origen o el decisor de un parámetro del proyecto, con un motivo; desde un aviso de divergencia, sale relleno con la cifra calculada"
entry = "008"
action = "D"
frequency = 2

[[command]]
key = "geoblender.core_confirm_parameter"
kind = "internal"
label.en = "Confirm parameter"
label.es = "Confirmar parámetro"
description.en = "Confirm a parameter marked «unconfirmed» or «review»"
description.es = "Confirma un parámetro marcado «sin confirmar» o «revisar»"
entry = "008"
action = "A"
frequency = 1

[[command]]
key = "geoblender.core_resolve_input"
kind = "internal"
label.en = "Decide on a changed input…"
label.es = "Decidir sobre una entrada cambiada…"
description.en = "Update the input from its source, keep the copy already imported or cancel"
description.es = "Actualiza la entrada desde su fuente, mantiene la copia ya importada o cancela"
entry = "008"
action = "D"
frequency = 2

[[command]]
key = "geoblender.core_discard_input"
kind = "internal"
label.en = "Discard input…"
label.es = "Descartar entrada…"
description.en = "Discard an input imported by mistake, with a reason: nothing is deleted and it stays in the register"
description.es = "Descarta una entrada importada por error, con un motivo: no se borra nada y sigue en el registro"
entry = "008"
action = "D"
frequency = 1

[[command]]
key = "geoblender.core_edit_input"
kind = "internal"
label.en = "Edit input…"
label.es = "Editar entrada…"
description.en = "Logical name and delivery data (date and who delivers it) of an input; its content does not change"
description.es = "Nombre lógico y datos de entrega (fecha y quién la entrega) de una entrada; su contenido no cambia"
entry = "008"
action = "D"
frequency = 1

[[command]]
key = "geoblender.core_resolve_dataset"
kind = "internal"
label.en = "Decide on a dataset edited outside…"
label.es = "Decidir sobre un dato editado fuera…"
description.en = "Accept the external edit with a reason, recompute or reimport a blocked or missing dataset; a damaged one can only be reimported"
description.es = "Acepta con un motivo la edición externa, recalcula o reimporta un dato bloqueado o que falta; uno dañado solo se puede reimportar"
entry = "008"
action = "D"
frequency = 1

[[command]]
key = "geoblender.core_accept_review"
kind = "internal"
label.en = "Accept as good…"
label.es = "Dar por buena…"
description.en = "Accept, with a reason, an operation that awaits manual review: what depends on it can then be recomputed"
description.es = "Da por buena, con un motivo, una operación que espera revisión a mano: lo que depende de ella se puede recalcular después"
entry = "008"
action = "D"
frequency = 1

[[command]]
key = "geoblender.core_resolve_unregistered"
kind = "internal"
label.en = "Unregistered layer or file…"
label.es = "Capa o fichero sin registrar…"
description.en = "Register as an input a layer created in the project from QGIS, or ignore it or a file left there by hand"
description.es = "Registra como entrada una capa creada en el proyecto desde QGIS, o la ignora, o ignora un fichero dejado a mano"
entry = "008"
action = "D"
frequency = 1

[[command]]
key = "geoblender.core_cancel_checks"
kind = "internal"
label.en = "Cancel the checks"
label.es = "Cancelar las comprobaciones"
description.en = "Stop the project checks and the hashes in progress"
description.es = "Para las comprobaciones del proyecto y los hashes en curso"
entry = "008"
action = "A"
frequency = 1

# Órdenes internas de la vista regenerable (spec 010, plan §5.3.3, D-18): las abren el aviso de
# una vista cargada sin su proyecto y el panel Proyecto, no un menú de la barra.

[[command]]
key = "geoblender.core_open_view_project"
kind = "internal"
label.en = "Open the project of this view"
label.es = "Abrir el proyecto de esta vista"
description.en = "Look for the project of the loaded view, where the view saved it or among the recent projects of this computer, and open it with its lock, read-only and migration rules"
description.es = "Busca el proyecto de la vista cargada, donde lo guardó la vista o entre los proyectos recientes de este equipo, y lo abre con sus reglas de cerrojo, solo lectura y migración"
entry = "010"
action = "D"
frequency = 1

[[command]]
key = "geoblender.core_locate_project"
kind = "internal"
label.en = "Locate the project…"
label.es = "Localizar el proyecto…"
description.en = "Choose the folder of the project of the loaded view when it is not found: only a project with the identity of the view is opened"
description.es = "Elige la carpeta del proyecto de la vista cargada cuando no se encuentra: solo abre un proyecto con la identidad de la vista"
entry = "010"
action = "D"
frequency = 1

# Orden interna de las decisiones de la propiedad (spec 009, plan §5.3.5, D-38): la abre
# «Registrar decisión…» de la ventana Encargos y decisiones de la propiedad, no un menú de la
# barra.

[[command]]
key = "geoblender.core_add_decision"
kind = "internal"
label.en = "Register decision…"
label.es = "Registrar decisión…"
description.en = "Record a decision of the owner (who decides, when, what and its document or reference) and the parameters and versions it affects"
description.es = "Registra una decisión de la propiedad (quién decide, cuándo, qué y su documento o referencia) y los parámetros y versiones a los que afecta"
entry = "009"
action = "D"
frequency = 1

# Órdenes internas de la cubicación (spec 011, plan §5.3.4, D-36): las abre la ventana de
# Materiales y densidades… (T20) y el menú «Diferencia ▾» de una rejilla de diferencias
# (T22: Exportar a GeoTIFF…), no un menú de la barra.

[[command]]
key = "geoblender.res_edit_column"
kind = "internal"
label.en = "Edit the materials column"
label.es = "Editar la columna de materiales"
description.en = "Add, remove or move a unit or a component of the materials column being edited (nothing is written until it is saved)"
description.es = "Añade, quita o mueve una unidad o un componente de la columna de materiales en edición (no se escribe nada hasta guardarla)"
entry = "011"
action = "A"
frequency = 2

[[command]]
key = "geoblender.res_save_materials"
kind = "internal"
label.en = "Save the column"
label.es = "Guardar la columna"
description.en = "Save the materials column being edited as the column of the project, with its record"
description.es = "Guarda la columna de materiales en edición como la del proyecto, con su registro"
entry = "011"
action = "A"
frequency = 2

[[command]]
key = "geoblender.res_apply_swell"
kind = "internal"
label.en = "Apply to all"
label.es = "Aplicar a todas"
description.en = "Give the swell factor K of this unit to every unit and component of the column, in one transaction"
description.es = "Pone el esponjamiento K de esta unidad en todas las unidades y componentes de la columna, en una transacción"
entry = "011"
action = "D"
frequency = 1

[[command]]
key = "geoblender.res_set_percentages"
kind = "internal"
label.en = "Percentages…"
label.es = "Porcentajes…"
description.en = "Percentages of the components of a compound unit, declared together: they must add up to 100 %"
description.es = "Porcentajes de los componentes de una unidad compuesta, declarados juntos: tienen que sumar 100 %"
entry = "011"
action = "D"
frequency = 1

[[command]]
key = "geoblender.res_export_difference"
kind = "internal"
label.en = "Export to GeoTIFF…"
label.es = "Exportar a GeoTIFF…"
description.en = "Write the registered difference grid as a deliverable GeoTIFF (it is not an operation: also from a superseded version and, outside the project, in read-only)"
description.es = "Escribe la rejilla de diferencias registrada como GeoTIFF entregable (no es una operación: también de una versión superada y, fuera del proyecto, en solo lectura)"
entry = "011"
action = "D"
frequency = 2

# La ventana de la cubicación y su exportación (T25; plan §5.3.4, D-29, D-37): las abren N ▸
# Proyecto ▸ Cubicaciones y la propia ventana, no un menú de la barra.

[[command]]
key = "geoblender.res_show_volumetrics"
kind = "internal"
label.en = "Cubications window"
label.es = "Ventana de las cubicaciones"
description.en = "Open the window of the cubications of the active version with the table of the chosen one (it reads what is registered: also in read-only and from a superseded version)"
description.es = "Abre la ventana de las cubicaciones de la versión activa con la tabla de la elegida (lee lo registrado: también en solo lectura y de una versión superada)"
entry = "011"
action = "P"
frequency = 2

[[command]]
key = "geoblender.res_export_csv"
kind = "internal"
label.en = "Export CSV…"
label.es = "Exportar CSV…"
description.en = "Write the registered cubication as a CSV for Excel in Spanish (it is not an operation: also from a superseded version and, outside the project, in read-only)"
description.es = "Escribe la cubicación registrada como CSV para Excel en español (no es una operación: también de una versión superada y, fuera del proyecto, en solo lectura)"
entry = "011"
action = "D"
frequency = 2

# Órdenes internas de los límites y las restricciones (spec 012, plan §5.3.4, D-38): las abre la
# ventana de Límites… (T22), no un menú de la barra.

[[command]]
key = "geoblender.core_declare_limits"
kind = "internal"
label.en = "Declare the limits"
label.es = "Declarar los límites"
description.en = "Declare the legal limit and the action perimeter from polygon layers of the project, with their reason, decider, date and inward setback"
description.es = "Declara el límite legal y el perímetro de actuación desde capas de polígonos del proyecto, con su motivo, su decisor, su fecha y su resguardo hacia dentro"
entry = "012"
action = "A"
frequency = 2

[[command]]
key = "geoblender.core_go_to_place"
kind = "internal"
label.en = "Go to"
label.es = "Ir a"
description.en = "Frame the 3D View on a place of the report (absolute coordinates)"
description.es = "Encuadra la Vista 3D en un lugar del informe (coordenadas absolutas)"
entry = "012"
action = "A"
frequency = 1

# Órdenes internas de las restricciones (spec 012, T23, plan §5.3.4, D-31): las abre la ventana de
# Restricciones…, no un menú de la barra.

[[command]]
key = "geoblender.core_create_constraints"
kind = "internal"
label.en = "From a layer…"
label.es = "Desde una capa…"
description.en = "Create constraints from a layer of the project: a type for all of its entities or the field that gives it, with their name, reason, decider, date and setbacks"
description.es = "Crea restricciones desde una capa del proyecto: un tipo para todas sus entidades o el campo que lo da, con su nombre, su motivo, su decisor, su fecha y sus resguardos"
entry = "012"
action = "D"
frequency = 2

[[command]]
key = "geoblender.core_complete_constraint"
kind = "internal"
label.en = "Complete…"
label.es = "Completar…"
description.en = "Complete or edit a constraint: its type, name, reason, decider, date and the setbacks it lacks (a constraint drawn in QGIS receives its code)"
description.es = "Completa o edita una restricción: su tipo, su nombre, su motivo, su decisor, su fecha y los resguardos que le faltan (una dibujada en QGIS recibe su código)"
entry = "012"
action = "D"
frequency = 2

[[command]]
key = "geoblender.gis_export_constraint_masks"
kind = "internal"
label.en = "Export the masks…"
label.es = "Exportar las máscaras…"
description.en = "Write the class grid of the masks of the active version as a deliverable GeoTIFF with its legend (it is not an operation: also from a superseded version and, outside the project, in read-only)"
description.es = "Escribe la rejilla de clases de las máscaras de la versión activa como un GeoTIFF entregable con su leyenda (no es una operación: también desde una versión superada y, fuera del proyecto, en solo lectura)"
entry = "012"
action = "D"
frequency = 1

# Órdenes internas de la búsqueda de intocables (spec 012, T24, plan §5.3.4): las abre la ventana
# de Buscar elementos intocables por sector…, no un menú de la barra.

[[command]]
key = "geoblender.core_declare_sectors"
kind = "internal"
label.en = "Declare the sectors"
label.es = "Declarar los sectores"
description.en = "Declare the search sectors from a layer of polygons of the project and the field that names them, or use the action perimeter as the only sector"
description.es = "Declara los sectores de búsqueda desde una capa de polígonos del proyecto y el campo que los nombra, o usa el perímetro de actuación como único sector"
entry = "012"
action = "A"
frequency = 2

[[command]]
key = "geoblender.core_search_untouchables"
kind = "internal"
label.en = "Search"
label.es = "Buscar"
description.en = "Search the untouchable elements within the search distance of the chosen sector, in the chosen layers, in steps"
description.es = "Busca los elementos intocables a la distancia de búsqueda del sector elegido, en las capas elegidas, por pasos"
entry = "012"
action = "A"
frequency = 3

[[command]]
key = "geoblender.core_convert_hit"
kind = "internal"
label.en = "Convert into untouchable…"
label.es = "Convertir en intocable…"
description.en = "Create an untouchable constraint from the entity found, with its setback and its reason"
description.es = "Crea una restricción intocable desde la entidad hallada, con su resguardo y su motivo"
entry = "012"
action = "D"
frequency = 2

[[command]]
key = "geoblender.core_discard_hit"
kind = "internal"
label.en = "Discard…"
label.es = "Descartar…"
description.en = "Discard the entity found with a reason: it stays in the record of the search"
description.es = "Descarta la entidad hallada con un motivo: queda en la constancia de la búsqueda"
entry = "012"
action = "D"
frequency = 2

[[command]]
key = "geoblender.core_close_search"
kind = "internal"
label.en = "Close the search"
label.es = "Cerrar la búsqueda"
description.en = "Record the search of the sector as in force, with what was found, converted and discarded, who closed it and when"
description.es = "Registra la búsqueda del sector como vigente, con lo hallado, lo convertido y lo descartado, quién la cierra y cuándo"
entry = "012"
action = "A"
frequency = 2

[[command]]
key = "geoblender.core_save_client_marks"
kind = "internal"
label.en = "Save the marks"
label.es = "Guardar las marcas"
description.en = "Save the entities of a layer of the project as client intentions, with their role, date, document and decision: they never enter a mask"
description.es = "Guarda las entidades de una capa del proyecto como intenciones del cliente, con su papel, fecha, documento y decisión: nunca entran en una máscara"
entry = "012"
action = "A"
frequency = 2

[[command]]
key = "geoblender.core_convert_intention"
kind = "internal"
label.en = "Convert into constraint…"
label.es = "Convertir en restricción…"
description.en = "Create a constraint from a client intention, with the type, reason and decider that are declared: the intention does not change"
description.es = "Crea una restricción desde una intención del cliente, con el tipo, el motivo y el decisor que se declaran: la intención no cambia"
entry = "012"
action = "D"
frequency = 2

# Diseño (spec 013, T22): la interna de «Perfiles de banco…» (de la «013» desde la T26).
[[command]]
key = "geoblender.des_save_bench_profile"
kind = "internal"
label.en = "Save profile…"
label.es = "Guardar perfil…"
description.en = "Create a bench profile, complete the values it lacks or rename it"
description.es = "Crea un perfil de banco, completa los valores que le faltan o lo renombra"
entry = "013"
action = "P"
frequency = 3

# Diseño (spec 013, T23): la interna de «Sectores de diseño…» (de la «013» desde la T26).
[[command]]
key = "geoblender.des_set_sector_slope"
kind = "internal"
label.en = "Set the sector slope…"
label.es = "Fijar el talud del sector…"
description.en = "Set the maximum general slope that a sector imposes on the design"
description.es = "Fija el talud general máximo que un sector impone al diseño"
entry = "013"
action = "P"
frequency = 3

# Diseño (spec 013, T28): la interna que exporta una rejilla del diseño; el botón está en la barra N
# «Diseño», con el objeto de la rejilla activo.
[[command]]
key = "geoblender.des_export_design_grid"
kind = "internal"
label.en = "Export grid to GeoTIFF…"
label.es = "Exportar rejilla a GeoTIFF…"
description.en = "Write a registered grid of the design (envelope, design surface or berm elevations) as a deliverable GeoTIFF (it is not an operation: also from a superseded version and, outside the project, in read-only)"
description.es = "Escribe una rejilla registrada del diseño (envolvente, superficie de diseño o cotas de berma) como GeoTIFF entregable (no es una operación: también de una versión superada y, fuera del proyecto, en solo lectura)"
entry = "013"
action = "D"
frequency = 2

# Diseño (spec 013, T44): la interna de «Declarar de nuevo desde una capa…» de «Sectores de diseño…»:
# lanza la declaración de la 012 (geoblender.core_declare_sectors) y vuelve a leer la ventana.
[[command]]
key = "geoblender.des_declare_sectors"
kind = "internal"
label.en = "Declare the sectors again"
label.es = "Declarar de nuevo los sectores"
description.en = "Declare the sectors again from the layer of polygons of the window and read the design sectors again"
description.es = "Declara de nuevo los sectores desde la capa de polígonos de la ventana y vuelve a leer los sectores de diseño"
entry = "013"
action = "A"
frequency = 2

# Entidades de diseño (spec 015, T25; RF-015-17): descartar una entidad y dar por bueno lo que perdió su apoyo. Internas: están en
# el menú «Entidad ▾» (T31; RF-015-28).
[[command]]
key = "geoblender.des_entity_discard"
kind = "internal"
label.en = "Discard…"
label.es = "Descartar…"
description.en = "Discard a design entity: it stays in the project as a record, nothing is deleted, and what rests on it is left as «support removed»"
description.es = "Descarta una entidad de diseño: queda en el proyecto como registro, no se borra nada y lo que se apoya en ella queda como «apoyo retirado»"
entry = "015"
action = "D"
frequency = 1

[[command]]
key = "geoblender.des_entity_release_support"
kind = "internal"
