# Entradas del roadmap y specs que nombra el catálogo de comandos (spec 003, RF-003-07):
# su título en inglés (el msgid) y en español, para «Disponible en <entrada · título>».
# delivered = true: la spec ya entrega sus comandos (sin la clase real del comando, sigue
# siendo provisional). Los títulos de los R-id son los de docs/producto/roadmap.md.

["002"]
title.en = "Project and georeference"
title.es = "Proyecto y georreferencia"
delivered = true

["003"]
title.en = "Geoblender interface"
title.es = "Interfaz Geoblender"
delivered = true

["004"]
title.en = "Background jobs"
title.es = "Trabajos en segundo plano"
delivered = true

# La 005 entrega sus órdenes tarea a tarea (T25…): todas son ya clases reales, y cada una
# está disponible cuando llega su orden (bl.ops.dh.UNDELIVERED; las demás dicen dónde estarán).
["005"]
title.en = "Drillholes"
title.es = "Sondeos"
delivered = true

# La 006 entrega sus órdenes tarea a tarea (T27, T28…): cada una está disponible cuando su
# operador real sustituye al provisional.
["006"]
title.en = "Base topography"
title.es = "Topografía base"
delivered = true

# La spec 008 es el bloque A de R-07 (su D-1) y entrega sus órdenes tarea a tarea: cada una
# está disponible cuando su operador real sustituye al provisional.
["008"]
title.en = "Provenance: parameters, inputs, operations and figures"
title.es = "Procedencia: parámetros, entradas, operaciones y cifras"
delivered = true

# La spec 009 es el bloque B de R-07 (plan 009 D-38) y entregó sus órdenes tarea a tarea: cada
# una pasó de R-07 a la 009 al llegar su clase real. T18: la versión activa (el control 8, su
# ventana, Proyecto ▸ Versiones ▸ Versión activa y Fijar la versión activa); T19: Nueva versión…,
# Cambiar estado… y el menú contextual «Versión ▾»; T21: Nueva revisión…; T23: Reproducir…; T24:
# Encargos y decisiones de la propiedad… y la interna Registrar decisión…. BS §8 lo dice desde la
# T31.
["009"]
title.en = "Versions, revisions and snapshots"
title.es = "Versiones, revisiones e instantáneas"
delivered = true

# La spec 010 (vistas regenerables) también sale de R-07 (D-18 de su plan) y entrega sus órdenes
# tarea a tarea: Refrescar las vistas desde el proyecto (T11), la primera; la interna «Abrir el
# proyecto de esta vista» (T12), en common.toml; Cifras de la selección (T16), la última.
["010"]
title.en = "Regenerable views"
title.es = "Vistas regenerables"
delivered = true

# La spec 011 (cubicación entre superficies) es R-38 (plan 011 D-36) y entrega sus órdenes tarea a
# tarea: cada orden de Cubicación pasa de R-38 a la 011 al llegar su clase real (T20 a T25), y sus
# internas (res_show_volumetrics, res_export_csv, res_export_difference y las de la ventana de los
# materiales, common.toml) llegan ya en la 011.
["011"]
title.en = "Volumetrics between surfaces"
title.es = "Cubicación entre superficies"
delivered = true

# La spec 012 (límites legales y restricciones) es R-32 (plan 012 D-38) y entrega sus órdenes tarea a
# tarea: cada orden de Diseño ▸ Límites y restricciones pasa de R-32 a la 012 al llegar su clase real
# (T22 a T28: Límites…, Restricciones…, Buscar intocables…, Intenciones…, Ver restricciones y límites,
# Compilar las máscaras y Verificar un diseño por recinto…, y sus internas, en common.toml).
# «Cuadrículas mineras…» sigue en R-32: es de la segunda spec (D-2).
["012"]
title.en = "Legal limits and constraints"
title.es = "Límites legales y restricciones"
delivered = true

# La spec 013 (envolventes y escalonado) es R-33 (plan 013 D-31): sus cuatro órdenes de Diseño
# (Perfiles de banco…, Sectores de diseño…, Vista previa de semillas, dominios y restricciones y
# Envolventes y escalonado…), sus dos internas (guardar un perfil y fijar el talud de un sector,
# common.toml) y el menú contextual «Diseño ▾» pasan de R-33 a la 013. R-33 sigue como entrada del
# roadmap (otras specs la nombran) y ya no la usa ningún comando.
["013"]
title.en = "Envelopes and benching"
title.es = "Envolventes y escalonado"
delivered = true

# La spec 014 (cantera con dos superficies) es R-34 (plan 014 §5.1 y §5.6, T05): sus cinco órdenes
# (Límite desde el perímetro…, Cantera con dos superficies…, Ajustar el diseño a un límite nuevo… y
# Solo relleno…, de Diseño ▸ Cantera, y Transiciones con el terreno no afectado, de Restauración ▸
# Superficie final) pasan de R-34 a la 014 y tienen su clase real desde la T20 a la T33; la T58 la
# entrega antes del H3 (sin «delivered» salían en gris con «Disponible en 014»). R-34 sigue como
# entrada del roadmap y ya no la usa ningún comando.
["014"]
title.en = "Quarry with two surfaces"
title.es = "Cantera con dos superficies"
delivered = true

# La spec 015 (entidades de diseño paramétricas) es la primera de R-36 (plan 015 §5.6, T31): «Plataforma…», las internas de
# las entidades (descartar, soltar el apoyo, traer, insertar, lo que se apoya en ella y la vista previa) y el menú
# contextual «Entidad ▾» pasan de R-36 a la 015 y los entrega. Lo de la 016 (Acopio…, Contrafuerte…, Cuerpo apoyado…) lo entrega
# la propia 016 (T35). R-36 sigue como entrada del roadmap.
["015"]
title.en = "Parametric design entities"
title.es = "Entidades de diseño paramétricas"
delivered = true

# La spec 016 (acopios, contrafuerte y cuerpos apoyados) es la segunda de R-36 (plan 016 §5.5, T20 y T35): sus órdenes
# (Acopio (detectar, retirar)…, Contrafuerte… y Cuerpo apoyado…, de Diseño ▸ Pistas y entidades ▸ Entidades; y las internas de detectar,
# los candidatos y retirar) pasan de R-36 a la 016 y las entrega la T35 con su menú; la «Unidad por espesor sobre su apoyo…» de R-18
# (`geo_create_thickness_unit`) es hoy el «Cuerpo apoyado…» (`des_create_body`, D-8 y D-14). R-36 sigue como entrada del roadmap: lo que
# aún no es una orden del menú «Entidad ▾» (editar el eje, las restricciones que declara) sigue marcado en R-36.
["016"]
title.en = "Stockpiles, buttress and supported bodies"
title.es = "Acopios, contrafuerte y cuerpos apoyados"
delivered = true

