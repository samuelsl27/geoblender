# Catálogo de comandos de Geoblender (spec 003). Atajos del modo Geoblender (AT §2): 49 combinaciones.
# Ctrl+F10 en el mapa «Window»; las demás, en «3D View». event: el tipo de evento de Blender.
# label: el nombre del atajo en la hoja de atajos cuando la clave no es un comando del catálogo
# (una variante solo de atajo, o un envoltorio interno con su menú o su panel).
# Las claves son las de los comandos del catálogo (bl_idname o clase, con ?prop=valor si fijan
# propiedades): cada sitio referencia el comando, nunca lo copia (RF-003-06, BS §7.1).

