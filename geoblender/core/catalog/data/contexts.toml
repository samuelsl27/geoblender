# Catálogo de comandos de Geoblender (spec 003). Menús contextuales (PC §3 y §4).
# Un menú «<Tipo> ▾» por tipo de objeto (Object.geoblender.kind, que registra la 006) y «Selección (n) ▾»;
# se ven en la fila 1 de la Vista 3D, en el clic derecho y con Mayús+Alt+B. icon: los dos
# iconos de acción de la fila 1. placeholder: algo que aún no es un comando (una propiedad del
# tipo, que llega con su entrada) y se dibuja desactivado con su «Disponible en …».
# Las claves son las de los comandos del catálogo (bl_idname o clase, con ?prop=valor si fijan
# propiedades): cada sitio referencia el comando, nunca lo copia (RF-003-06, BS §7.1).

