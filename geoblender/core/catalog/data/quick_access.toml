# Catálogo de comandos de Geoblender (spec 003). Acceso rápido (AR §2 y §3).
# [[project]]: los 8 controles de la barra superior; [[view]]: los 24 de la fila 2 de cada
# Vista 3D, por grupos. compact_step: el paso del plegado (AR §3.3) que lo deja en solo icono;
# fold_step: el que lo lleva a «»» (sin él, nunca se pliega); edit_modes: se queda en los modos
# de edición de malla y de curva; width_text: el texto con que se mide su anchura.
# Las claves son las de los comandos del catálogo (bl_idname o clase, con ?prop=valor si fijan
# propiedades): cada sitio referencia el comando, nunca lo copia (RF-003-06, BS §7.1).

[groups]
view = {en = "Viewing", es = "Vista"}
section = {en = "Section", es = "Sección"}
draw = {en = "Drafting", es = "Dibujo"}
query = {en = "Query", es = "Consulta"}
compute = {en = "Calculation and control", es = "Cálculo y control"}
command = {en = "Command", es = "Comando"}

