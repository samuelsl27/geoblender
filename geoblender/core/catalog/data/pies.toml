# Catálogo de comandos de Geoblender (spec 003). Menús circulares (AR §4).
# Ranuras en el orden de Blender: W (O), E, S, N, NW (NO), NE, SW (SO), SE. Se abren con
# geoblender.ui_call_pie (name), que exige el modo Geoblender (AT §1, regla 2).
# Las claves son las de los comandos del catálogo (bl_idname o clase, con ?prop=valor si fijan
# propiedades): cada sitio referencia el comando, nunca lo copia (RF-003-06, BS §7.1).

[[pie]]
id = "GEOBLENDER_MT_ui_pie_views"
label.en = "Views"
label.es = "Vistas"
description.en = "Pie menu of the mining views"
description.es = "Menú circular de las vistas mineras"
entry = "003"
icon = "gb_qat_views"
icon_fallback = "VIEW_ORTHO"
W = "geoblender.ui_set_view?view=WEST"
E = "geoblender.ui_set_view?view=EAST"
S = "geoblender.ui_set_view?view=SOUTH"
N = "geoblender.ui_set_view?view=NORTH"
NW = "geoblender.ui_set_view?view=PLAN"
NE = "geoblender.geo_align_view_to_section"
SW = "geoblender.ui_set_view?view=ISO_NE"
SE = "geoblender.ui_frame_work_window"

[[pie]]
id = "GEOBLENDER_MT_gis_pie_polyline"
label.en = "Polyline editing"
label.es = "Edición de polilíneas"
description.en = "Pie menu of the polyline editing"
description.es = "Menú circular de la edición de polilíneas"
entry = "R-09"
icon = "gb_qat_polyline_edit"
icon_fallback = "MOD_CURVE"
W = "geoblender.gis_toggle_polyline_closed"
E = "geoblender.gis_reverse_polyline"
S = "geoblender.gis_split_polyline"
N = "geoblender.gis_join_polylines"
NW = "geoblender.gis_densify_polyline"
NE = "geoblender.gis_simplify_polyline"
SW = "geoblender.gis_offset_polyline"
SE = "geoblender.gis_drape_polyline"

[[pie]]
id = "GEOBLENDER_MT_geo_pie_solids"
label.en = "Solids"
label.es = "Sólidos"
description.en = "Pie menu of the solids"
description.es = "Menú circular de los sólidos"
entry = "R-17"
icon_fallback = "MESH_ICOSPHERE"
W = "geoblender.geo_link_outlines"
E = "geoblender.geo_validate_solid"
S = "geoblender.geo_cap_solid"
N = "geoblender.geo_compute_solid_volume"
NW = "geoblender.geo_draw_tie_lines"
NE = "geoblender.geo_repair_solid"
SW = "geoblender.geo_boolean_solids?operation=UNION"
SE = "geoblender.geo_boolean_solids?operation=DIFFERENCE"

[[pie]]
id = "GEOBLENDER_MT_ui_pie_snap"
label.en = "Snapping"
label.es = "Encaje"
description.en = "Pie menu of the snapping"
description.es = "Menú circular del encaje"
entry = "R-09"
icon_fallback = "SNAP_ON"
W = "geoblender.ui_set_snap_target?target=VERTEX"
E = "geoblender.ui_set_snap_target?target=EDGE"
S = "geoblender.ui_set_snap_target?target=GRID"
N = "geoblender.ui_set_snap_target?target=SURFACE"
NW = "geoblender.ui_set_snap_target?target=COLLAR"
NE = "geoblender.ui_set_snap_target?target=DRILLHOLE_CONTACT"
SW = "geoblender.ui_set_snap_target?target=INTERSECTION"
SE = "tool_settings.use_snap"
