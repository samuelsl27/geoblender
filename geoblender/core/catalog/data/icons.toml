# Iconos propios de Geoblender (II §1.4; spec 003, T31; RF-003-22): los 58, con su reserva
# nativa de Blender (comprobada en el enumerado de iconos de la versión instalada) y, si la
# reserva es un texto («GB», «[MED]»…), fallback_text. La fuente de cada uno es
# assets/icons/<name>.svg y sus PNG, resources/icons/<name>_32.png y _64.png
# (tools/build_icons.py). Los comandos del catálogo nombran su icono con «icon»; los demás
# (ramas, estados, tipos de entidad y de cifra) los usan el inventario, la ficha y las
# insignias de las entradas que los entregan.

[[icon]]
name = "gb_logo"
fallback = "NONE"
fallback_text = "GB"

