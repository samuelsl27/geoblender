# Catálogo de comandos de Geoblender (spec 003). BS: docs/arquitectura/interfaz/barra-superior.md
# Paso 9 de 11: Cubicación (BS §8.9).
# Cada comando se define una sola vez, en su casa: key (bl_idname o clase; con ?prop=valor si
# fija propiedades), label y description en inglés (el msgid) y en español, entry (spec o R-id),
# action (A, D, P, H, S, T), background (·2p) y frequency (0 ○ … 3 ●●●). ref = acceso cruzado ↗;
# mirror = el mismo comando sin la marca. El módulo sale del identificador (ADR-0011). doc_id: con
# qué identificadores lista BS §8 un submenú de variantes; dynamic: su contenido se calcula al
# dibujarlo (proyectos recientes, versiones).

