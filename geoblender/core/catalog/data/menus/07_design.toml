id = "GEOBLENDER_MT_ui_design"
label.en = "Design"
label.es = "Diseño"
description.en = "Limits and constraints, bench profiles, quarry or pit, haul roads and entities"
description.es = "Límites y restricciones, perfiles de banco, cantera o corta, pistas y entidades"
stage.en = "Mine design"
stage.es = "Diseño de la explotación"
step = 7
